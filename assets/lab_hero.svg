<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="Illustration of a laboratory bench with a microscope, test tubes, a flask and a monitor showing an asset dashboard">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d366b" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cde2fb"/>
      <stop offset="1" stop-color="#d7f3e8"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <circle cx="300" cy="205" r="175" fill="url(#glow)"/>
  <circle cx="92" cy="330" r="30" fill="#e8f1fc"/>
  <circle cx="520" cy="120" r="14" fill="#fde7dd"/>
  <circle cx="36" cy="150" r="8" fill="#d7f3e8"/>

  <!-- calendar / booking card -->
  <g filter="url(#shadow)">
    <rect x="52" y="48" width="104" height="82" rx="14" fill="#ffffff"/>
    <path d="M52 62a14 14 0 0 1 14-14h76a14 14 0 0 1 14 14v10H52z" fill="#eb6834"/>
    <g fill="#cde2fb">
      <rect x="66" y="84" width="14" height="10" rx="3"/><rect x="86" y="84" width="14" height="10" rx="3"/>
      <rect x="106" y="84" width="14" height="10" rx="3"/><rect x="126" y="84" width="14" height="10" rx="3"/>
      <rect x="66" y="102" width="14" height="10" rx="3"/><rect x="106" y="102" width="14" height="10" rx="3"/>
      <rect x="126" y="102" width="14" height="10" rx="3"/>
    </g>
    <rect x="86" y="102" width="14" height="10" rx="3" fill="#2a78d6"/>
  </g>

  <!-- status pill -->
  <g filter="url(#shadow)">
    <rect x="214" y="58" width="150" height="40" rx="20" fill="#ffffff"/>
    <circle cx="236" cy="78" r="9" fill="#1baf7a"/>
    <path d="M231.5 78.5l3.2 3.2 6-6.4" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="254" y="70" width="90" height="6" rx="3" fill="#9ec5f4"/>
    <rect x="254" y="82" width="60" height="6" rx="3" fill="#cde2fb"/>
  </g>

  <!-- gear (maintenance) -->
  <g transform="translate(470 82)">
    <circle r="27" fill="none" stroke="#eda100" stroke-width="12" stroke-dasharray="9 7.9"/>
    <circle r="21" fill="#eda100"/>
    <circle r="8" fill="#ffffff"/>
  </g>

  <!-- monitor with dashboard -->
  <g filter="url(#shadow)">
    <rect x="246" y="140" width="196" height="132" rx="12" fill="#0d366b"/>
    <rect x="257" y="151" width="174" height="106" rx="6" fill="#ffffff"/>
  </g>
  <g>
    <rect x="270" y="223" width="18" height="26" rx="3" fill="#2a78d6"/>
    <rect x="296" y="203" width="18" height="46" rx="3" fill="#1baf7a"/>
    <rect x="322" y="213" width="18" height="36" rx="3" fill="#eb6834"/>
    <rect x="348" y="191" width="18" height="58" rx="3" fill="#2a78d6"/>
    <rect x="374" y="207" width="18" height="42" rx="3" fill="#eda100"/>
    <rect x="400" y="197" width="18" height="52" rx="3" fill="#1baf7a"/>
    <polyline points="270,186 296,174 322,180 348,164 374,170 418,160" fill="none" stroke="#6250d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="418" cy="160" r="4.5" fill="#6250d6"/>
  </g>
  <rect x="334" y="272" width="20" height="34" fill="#0d366b"/>
  <rect x="304" y="306" width="80" height="14" rx="6" fill="#184f95"/>

  <!-- microscope -->
  <g>
    <rect x="70" y="302" width="104" height="18" rx="7" fill="#184f95"/>
    <rect x="140" y="200" width="18" height="104" rx="7" fill="#256abf"/>
    <path d="M149 206 Q149 166 116 156" stroke="#256abf" stroke-width="18" fill="none" stroke-linecap="round"/>
    <g transform="rotate(-22 108 172)">
      <rect x="95" y="134" width="28" height="78" rx="7" fill="#3987e5"/>
      <rect x="99" y="112" width="20" height="26" rx="5" fill="#0d366b"/>
    </g>
    <rect x="113" y="212" width="12" height="20" rx="3" fill="#0d366b"/>
    <rect x="86" y="240" width="76" height="10" rx="5" fill="#0d366b"/>
    <circle cx="158" cy="266" r="11" fill="#1c5cab"/>
    <circle cx="158" cy="266" r="4" fill="#9ec5f4"/>
  </g>

  <!-- test tube rack -->
  <g>
    <rect x="186" y="236" width="13" height="66" rx="6.5" fill="#ffffff" stroke="#256abf" stroke-width="3"/>
    <rect x="189" y="270" width="7" height="29" rx="3.5" fill="#e87ba4"/>
    <rect x="206" y="236" width="13" height="66" rx="6.5" fill="#ffffff" stroke="#256abf" stroke-width="3"/>
    <rect x="209" y="258" width="7" height="41" rx="3.5" fill="#eda100"/>
    <rect x="226" y="236" width="13" height="66" rx="6.5" fill="#ffffff" stroke="#256abf" stroke-width="3"/>
    <rect x="229" y="276" width="7" height="23" rx="3.5" fill="#6250d6"/>
    <rect x="178" y="262" width="70" height="9" rx="4" fill="#eb6834"/>
    <rect x="178" y="294" width="70" height="10" rx="4" fill="#eb6834"/>
    <rect x="182" y="300" width="7" height="20" fill="#d95926"/>
    <rect x="237" y="300" width="7" height="20" fill="#d95926"/>
  </g>

  <!-- erlenmeyer flask -->
  <g>
    <circle cx="482" cy="186" r="6" fill="#1baf7a" opacity="0.9"/>
    <circle cx="492" cy="166" r="4" fill="#1baf7a" opacity="0.7"/>
    <circle cx="478" cy="150" r="3" fill="#1baf7a" opacity="0.5"/>
    <path d="M458 318 L516 318 Q526 318 522 308 L497 254 L497 212 L471 212 L471 254 L446 308 Q442 318 458 318 Z" fill="#ffffff" stroke="#256abf" stroke-width="4" stroke-linejoin="round"/>
    <path d="M454 285 L514 285 L520 300 Q524 314 512 314 L456 314 Q444 314 448 300 Z" fill="#1baf7a" opacity="0.88"/>
    <rect x="464" y="204" width="40" height="10" rx="5" fill="#256abf"/>
  </g>

  <!-- bench -->
  <rect x="28" y="318" width="504" height="16" rx="8" fill="#0d366b"/>
  <rect x="60" y="334" width="14" height="44" rx="4" fill="#184f95"/>
  <rect x="486" y="334" width="14" height="44" rx="4" fill="#184f95"/>
</svg>
